<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} — {{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ "/assets/style.css" | relative_url }}">
</head>

<body>
  {% include header.html %}

  <div class="tp-layout">
    <main class="container">

      <h1>{{ page.title }}</h1>

      {% if page.objective %}
      <div class="section objective">
        <h2>🎯 Objectif</h2>
        <p>{{ page.objective }}</p>
      </div>
      {% endif %}

      {{ content }}

    </main>

    <aside class="toc-sidebar" aria-label="Sommaire">
      <div class="toc-inner">
        <p class="toc-title">Sommaire</p>
        <nav id="toc-nav"></nav>
      </div>
    </aside>
  </div>

  {% include footer.html %}

  <script>
  (function () {
    var headings = document.querySelector('main').querySelectorAll('h2, h3');
    var nav = document.getElementById('toc-nav');
    if (!headings.length || !nav) return;

    var ul = document.createElement('ul');
    headings.forEach(function (h, i) {
      if (!h.id) h.id = 'toc-' + i;
      var li = document.createElement('li');
      li.className = h.tagName === 'H3' ? 'toc-h3' : 'toc-h2';
      var a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent.replace(/^[\p{Emoji}\s]+/u, '').trim();
      li.appendChild(a);
      ul.appendChild(li);
    });
    nav.appendChild(ul);

    // Highlight active section on scroll
    var links = nav.querySelectorAll('a');
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          links.forEach(function (l) { l.classList.remove('active'); });
          var active = nav.querySelector('a[href="#' + entry.target.id + '"]');
          if (active) active.classList.add('active');
        }
      });
    }, { rootMargin: '-10% 0px -80% 0px', threshold: 0 });

    headings.forEach(function (h) { observer.observe(h); });
  })();
  </script>
</body>
</html>
